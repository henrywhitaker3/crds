#:schema https://mise.jdx.dev/schema/mise.json

[tools]
go = "1.27.4"
gotestsum = "1.13.0"

[tasks.generate]
description = "Generate CRD schemas"
run = "go run main.go"

[tasks.prune]
description = "Prune orhpaned CRD schemas"
run = "go run main.go --prune"

[tasks.test]
description = "Run the unit tests"
usage = '''
flag "--packages <packages>"
'''
run = '''
gotestsum --format testname --packages "{{ usage.packages }}"
'''
